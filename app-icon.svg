  <rect x="32" y="32" width="960" height="960" rx="200" ry="200" fill="#1C1B19"/>

  <!-- Stylized "M↓" mark in terracotta accent -->
  <g fill="#C76D46">
    <!-- Letter M shape made from two peaks -->
    <path d="M 240 720 L 240 304 L 360 304 L 472 520 L 584 304 L 704 304 L 704 720 L 612 720 L 612 460 L 512 640 L 432 640 L 332 460 L 332 720 Z"/>
