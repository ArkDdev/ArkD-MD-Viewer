[package]
name = "arkd-md-viewer"
version = "1.2.3"
description = "ArkD. MD Viewer — fast, lightweight markdown viewer"
authors = ["ArkD"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "arkd_md_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
notify = "6"
notify-debouncer-mini = "0.4"
tokio = { version = "1", features = ["time"] }
dirs = "5"

# Windows-only — needed for UAC elevation via ShellExecuteW with verb=runas
# and for is_elevated() probing via TokenElevation. Gated by target_os, so
# non-Windows builds skip this crate entirely.
#
# Feature list explained:
#   - Win32_Foundation: HANDLE, PCWSTR, etc. — required by everything below
#   - Win32_UI_Shell: ShellExecuteW + SE_ERR_* error codes (UAC launch)
#   - Win32_UI_WindowsAndMessaging: SW_NORMAL (window show state for ShellExecuteW)
#   - Win32_System_Threading: GetCurrentProcess, OpenProcessToken (current process handle)
#   - Win32_Security: TokenElevation, TOKEN_ELEVATION, TOKEN_QUERY, GetTokenInformation,
#                    CloseHandle, TOKEN_ACCESS_MASK (token-elevation probe)
#                    NOTE: OpenProcessToken also lives in Threading but takes a
#                    TOKEN_ACCESS_MASK from Security — so we need both features.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
