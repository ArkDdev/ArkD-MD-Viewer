[package]
name = "arkd-md-viewer"
version = "0.1.0"
description = "ArkD. MD Viewer — fast, lightweight markdown viewer"
authors = ["ArkD"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "arkd_md_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
notify = "6"
notify-debouncer-mini = "0.4"
tokio = { version = "1", features = ["time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
